[package]
name = "intellectus-core"
version = "0.1.0"
edition = "2021"
description = "THE INTELLECTUS — The Substance: single-writer event-sourced state, axiomatic knowledge graph, verifier and outbox"
license = "Apache-2.0"

[lib]
name = "intellectus_core"
path = "src/lib.rs"

[[bin]]
name = "intellectus-core"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
ed25519-dalek = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
debug = false
